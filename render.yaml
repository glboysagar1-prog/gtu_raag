services:
  - type: web
    name: gtu-rag
    env: docker
    dockerfilePath: Dockerfile
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: HANDWRITTEN_ANSWER
        value: "true"
    autoDeploy: true